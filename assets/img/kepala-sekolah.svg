<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbd0a1"/>
      <stop offset="100%" stop-color="#e8b27c"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="peciGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background Circle / Frame -->
  <rect width="500" height="500" fill="url(#bgGrad)"/>
  <circle cx="250" cy="250" r="230" fill="none" stroke="url(#goldAccent)" stroke-width="6" opacity="0.4"/>
  <circle cx="250" cy="250" r="215" fill="#044332" opacity="0.6"/>

  <!-- Islamic Pattern Glow -->
  <g stroke="#10b981" stroke-width="1" fill="none" opacity="0.15">
    <circle cx="250" cy="250" r="180"/>
    <circle cx="250" cy="250" r="140"/>
  </g>

  <!-- Body / Suit -->
  <g>
    <!-- Shoulders / Coat -->
    <path d="M 90 500 C 100 410, 150 370, 250 370 C 350 370, 400 410, 410 500 Z" fill="url(#suitGrad)"/>
    
    <!-- White Shirt Collar -->
    <polygon points="210,360 250,420 290,360 270,360 250,390 230,360" fill="#ffffff"/>
    
    <!-- Tie (Green/Gold Islamic School Style) -->
    <polygon points="245,390 255,390 260,490 250,510 240,490" fill="#047857"/>
    <line x1="242" y1="420" x2="258" y2="430" stroke="#fbbf24" stroke-width="2"/>
    <line x1="241" y1="450" x2="259" y2="460" stroke="#fbbf24" stroke-width="2"/>

    <!-- Suit Lapels -->
    <path d="M 180 375 L 230 460 L 210 470 L 160 395 Z" fill="#334155"/>
    <path d="M 320 375 L 270 460 L 290 470 L 340 395 Z" fill="#334155"/>
  </g>

  <!-- Neck -->
  <rect x="225" y="320" width="50" height="60" rx="8" fill="url(#skinGrad)"/>

  <!-- Head -->
  <ellipse cx="250" cy="250" rx="72" ry="85" fill="url(#skinGrad)"/>

  <!-- Ears -->
  <ellipse cx="178" cy="255" rx="14" ry="22" fill="#e8b27c"/>
  <ellipse cx="322" cy="255" rx="14" ry="22" fill="#e8b27c"/>

  <!-- Indonesian Muslim Peci / Kopiah Hitam -->
  <path d="M 172 210 C 172 170, 185 140, 250 138 C 315 140, 328 170, 328 210 Z" fill="url(#peciGrad)"/>
  <rect x="170" y="202" width="160" height="18" rx="4" fill="#1e293b"/>
  <!-- Velvet Texture Shine on Peci -->
  <path d="M 210 148 Q 250 143 290 148 L 285 165 Q 250 160 215 165 Z" fill="#475569" opacity="0.35"/>

  <!-- Hair under Peci -->
  <path d="M 174 212 C 176 230, 182 240, 182 245" stroke="#1e293b" stroke-width="4" fill="none"/>
  <path d="M 326 212 C 324 230, 318 240, 318 245" stroke="#1e293b" stroke-width="4" fill="none"/>

  <!-- Eyes & Eyebrows -->
  <path d="M 205 230 Q 222 224 235 230" stroke="#1e293b" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 265 230 Q 278 224 295 230" stroke="#1e293b" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <ellipse cx="220" cy="242" rx="7" ry="8" fill="#1e293b"/>
  <ellipse cx="280" cy="242" rx="7" ry="8" fill="#1e293b"/>
  <circle cx="222" cy="239" r="2.5" fill="#ffffff"/>
  <circle cx="282" cy="239" r="2.5" fill="#ffffff"/>

  <!-- Friendly Smile & Glasses (Kacamata Profesional) -->
  <rect x="202" y="232" width="36" height="24" rx="8" fill="none" stroke="#64748b" stroke-width="2.5"/>
  <rect x="262" y="232" width="36" height="24" rx="8" fill="none" stroke="#64748b" stroke-width="2.5"/>
  <line x1="238" y1="242" x2="262" y2="242" stroke="#64748b" stroke-width="2.5"/>
  <line x1="185" y1="238" x2="202" y2="242" stroke="#64748b" stroke-width="2"/>
  <line x1="298" y1="242" x2="315" y2="238" stroke="#64748b" stroke-width="2"/>

  <!-- Nose -->
  <path d="M 248 245 Q 254 265 248 272 Q 252 274 256 272" stroke="#d97706" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Smile / Mouth -->
  <path d="M 230 295 Q 250 312 270 295" stroke="#991b1b" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Polite Dimple lines -->
  <path d="M 226 293 Q 228 298 225 301" stroke="#d97706" stroke-width="1.5" fill="none"/>
  <path d="M 274 293 Q 272 298 275 301" stroke="#d97706" stroke-width="1.5" fill="none"/>

  <!-- Name Badge on Coat -->
  <rect x="140" y="445" width="70" height="18" rx="3" fill="#000000" stroke="#fbbf24" stroke-width="1"/>
  <text x="175" y="458" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">KEPALA SEKOLAH</text>
</svg>
