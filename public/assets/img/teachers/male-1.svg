<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd3a8"/>
      <stop offset="100%" stop-color="#e2a874"/>
    </linearGradient>
    <linearGradient id="peci" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="180" fill="#ffffff" opacity="0.6"/>
  <!-- Body / Clothes -->
  <path d="M 80 400 C 90 320, 130 290, 200 290 C 270 290, 310 320, 320 400 Z" fill="url(#shirt)"/>
  <!-- White Collar -->
  <polygon points="175,280 200,330 225,280 215,280 200,310 185,280" fill="#ffffff"/>
  <!-- Neck -->
  <rect x="180" y="245" width="40" height="50" rx="8" fill="url(#skin)"/>
  <!-- Head -->
  <ellipse cx="200" cy="190" rx="60" ry="70" fill="url(#skin)"/>
  <!-- Ears -->
  <ellipse cx="140" cy="195" rx="10" ry="18" fill="#e2a874"/>
  <ellipse cx="260" cy="195" rx="10" ry="18" fill="#e2a874"/>
  <!-- Peci -->
  <path d="M 135 155 C 135 120, 145 95, 200 93 C 255 95, 265 120, 265 155 Z" fill="url(#peci)"/>
  <rect x="133" y="148" width="134" height="15" rx="3" fill="#0f172a"/>
  <!-- Face details -->
  <ellipse cx="178" cy="185" rx="5" ry="6" fill="#1e293b"/>
  <ellipse cx="222" cy="185" rx="5" ry="6" fill="#1e293b"/>
  <circle cx="180" cy="183" r="2" fill="#fff"/>
  <circle cx="224" cy="183" r="2" fill="#fff"/>
  <path d="M 168 175 Q 180 170 190 175" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 210 175 Q 220 170 232 175" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 198 190 Q 204 205 198 212" stroke="#d97706" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Smile -->
  <path d="M 185 228 Q 200 240 215 228" stroke="#991b1b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
